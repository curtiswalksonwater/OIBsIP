<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="converter-container">
        <h1>Temperature Converter</h1>

        <div class="input-group">
            <label for="temperature">Enter Temperature:</label>
            <input type="number" id="temperature" placeholder="Enter value" step="any">
            <span class="error-message" id="errorMessage"></span>
        </div>

        <div class="input-group">
            <label for="unit">Select Unit:</label>
            <select id="unit">
                <option value="celsius">Celsius (°C)</option>
                <option value="fahrenheit">Fahrenheit (°F)</option>
                <option value="kelvin">Kelvin (K)</option>
            </select>
        </div>

        <button id="convertBtn">Convert</button>

        <div class="results" id="results">
            <div class="result-item">
                <span class="result-label">Celsius:</span>
                <span class="result-value" id="celsiusResult">--</span>
            </div>
            <div class="result-item">
                <span class="result-label">Fahrenheit:</span>
                <span class="result-value" id="fahrenheitResult">--</span>
            </div>
            <div class="result-item">
                <span class="result-label">Kelvin:</span>
                <span class="result-value" id="kelvinResult">--</span>
            </div>
        </div>

        <div class="error-display" id="errorDisplay"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
